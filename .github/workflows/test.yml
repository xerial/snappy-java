name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - '**.scala'
              - '**.java'
              - '**.sbt'
              - '.github/workflows/*.yml'
              - '**.so'
              - '**.dll'
              - 'src/main/resources/**'
              - 'project/build.properties'
              - '.scalafmt.conf'
              - 'sbt'
              - 'sbt.bat'
  code_format:
    name: code format
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: scalafmt test
        run: ./sbt scalafmtCheckAll
  test-jdk:
    strategy:
      matrix:
        version: [ '8', '11', '17', '21', '25' ]
    name: test jdk${{ matrix.version }}
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        id: test-jdk
        with:
          distribution: 'zulu'
          java-version: ${{ matrix.version }}
      # sbt 2 requires JDK 17+. Run sbt on JDK 21 and fork tests on the matrix JDK via TEST_JAVA_HOME
      - uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '21'
      - uses: actions/cache@v6
        with:
          path: ~/.cache
          key: ${{ runner.os }}-jdk${{ matrix.version }}-${{ hashFiles('**/*.sbt') }}
          restore-keys: ${{ runner.os }}-jdk${{ matrix.version }}-
      - name: Test
        env:
          TEST_JAVA_HOME: ${{ steps.test-jdk.outputs.path }}
        run: |
          if [ "${{ matrix.version }}" -ge "24" ]; then
            export _JAVA_OPTIONS="--enable-native-access=ALL-UNNAMED"
          fi
          # testFull: sbt 2's test skips tests that passed in a cached previous run
          ./sbt testFull
      - name: JAR Integration Test
        env:
          TEST_JAVA_HOME: ${{ steps.test-jdk.outputs.path }}
        run: ./script/test-jar-integration.sh
  test-musl:
    strategy:
      matrix:
        include:
          # musl-based JVM: the x86_64-musl native library must be used
          - name: alpine
            container: eclipse-temurin:17-jdk-alpine
            expected_arch: x86_64-musl
          # glibc-based JVM with musl also installed (#692): the glibc native library must be used
          - name: glibc with musl installed
            container: ''
            expected_arch: x86_64
    name: test ${{ matrix.name }}
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    container: ${{ matrix.container }}
    steps:
      - name: Install packages (alpine)
        if: ${{ matrix.container != '' }}
        run: apk add --no-cache bash curl git
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        if: ${{ matrix.container == '' }}
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Install musl
        if: ${{ matrix.container == '' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y musl
          ls -l /lib/ld-musl-x86_64.so.1
      - name: Check native library architecture
        shell: bash
        run: |
          ./sbt compile
          classes=$(find target -type d -path '*/snappy-java/classes' | head -1)
          arch=$(java -cp "$classes" org.xerial.snappy.OSInfo --arch)
          echo "detected arch: $arch"
          test "$arch" = "${{ matrix.expected_arch }}"
      - name: Test
        shell: bash
        run: ./sbt testFull
